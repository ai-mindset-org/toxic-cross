<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Krest · personal reflection</title><link rel="stylesheet" href="/движок/workspace-v2.css"><style>main{max-width:600px;margin:50px auto;padding:24px}label{display:block;margin:20px 0}textarea,select,button{font:inherit;padding:10px;max-width:100%}textarea{display:block;width:100%;min-height:120px}</style></head><body><main><a href="/">Krest →</a><h1>One reflection · один отклик</h1><p>Choose a direction and write an optional observation. Saving adds it to this private board.</p><p>Выбери направление и запиши наблюдение. Сохранение добавит его в этот личный борт.</p><form id="reflection"><label>Direction · направление <select id="arm"><option value="ресурсы">resources · ресурсы</option><option value="прошлое">past · прошлое</option><option value="обязательства">obligations · обязательства</option><option value="будущее">future · будущее</option></select></label><label>Observation · наблюдение<textarea id="note" required maxlength="280"></textarea></label><button>save · сохранить</button></form><p id="status" role="status"></p></main><script>
const q=new URLSearchParams(location.search),arm=document.getElementById('arm');if([...arm.options].some(o=>o.value===q.get('луч')))arm.value=q.get('луч');document.getElementById('reflection').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),status=document.getElementById('status');button.disabled=true;try{const response=await fetch('/отклик',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({'событие':(q.get('событие')||'Personal reflection').slice(0,160),'луч':arm.value,'текст':document.getElementById('note').value.trim(),'вес':2})});if(!response.ok)throw Error();status.textContent='Saved · сохранено';e.target.hidden=true;}catch{status.textContent='Could not save. Try again · Не удалось сохранить. Попробуй снова';button.disabled=false;}});
</script></body></html>
